<!--
  PoE2 Route — a minimal campaign tracker for Path of Exile 2.
  Route data adapted from domistae/poe2-leveling (MIT): https://github.com/domistae/poe2-leveling
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE2 Route</title>
<meta name="description" content="Minimal Path of Exile 2 campaign tracker: Acts I–IV and Interludes, short steps, progress saved in your browser.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23d9a441'/><path d='M4 8.5l2.5 2.5L12 5' stroke='%23161412' stroke-width='2' fill='none'/></svg>">
<script>
  try { var t = localStorage.getItem('poe2route:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="brand">PoE2 Route</span>
    <nav class="tabs" id="tabs" aria-label="Acts"></nav>
    <button class="icon" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
  <div class="bar sub">
    <div class="toggles">
      <button class="tog" id="t-opt" aria-pressed="false">Optional</button>
      <button class="tog" id="t-tips" aria-pressed="false">Tips</button>
      <button class="tog" id="t-done" aria-pressed="false">Hide done</button>
    </div>
    <div class="prog" id="prog"><span class="prog-n"></span><span class="prog-bar"><i></i></span><button class="tog" id="reset" title="Untick every step in this act">Reset</button></div>
  </div>
  <div class="next" id="next" hidden>
    <div class="next-main">
      <div class="next-k">Current <span class="next-zone"></span></div>
      <div class="next-text"></div>
      <div class="next-then" hidden><span class="next-then-label">Then</span> <span class="next-then-zone"></span><span class="next-then-text"></span></div>
    </div>
    <button class="back-btn" id="back-btn" title="Unmark and go back to previous step" aria-label="Unmark and go back to previous step">↶</button>
    <button class="next-btn" id="next-btn" title="Mark done" aria-label="Mark done">✓</button>
  </div>
</header>

<main id="main"></main>

<footer class="foot">
  <div class="foot-actions">
    <button id="export">Copy progress</button>
    <button id="import">Paste progress</button>
  </div>
  <p>
    Route data adapted from
    <a href="https://domistae.github.io/poe2-leveling/">domistae's PoE2 Leveling Guide</a>
    (<a href="https://github.com/domistae/poe2-leveling">source</a>, MIT), rewritten in short form.
  </p>
  <p class="dim">Unofficial fan project. Path of Exile 2 © Grinding Gear Games. Progress is stored only in this browser.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
